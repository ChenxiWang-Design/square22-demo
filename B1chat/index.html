<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B1chat 群聊</title>
  <link rel="stylesheet" href="b1chat.css">
</head>
<body>
  <div class="b1chat-container">
    <!-- 底图背景：与 Register 系列一致的渐变背景 -->
    <div class="b1chat-background">
      <img src="../Pic/Register/渐变背景.jpg" alt="背景" class="b1chat-background-image" />
    </div>

    <!-- 顶部：群聊 Top SVG，顶端与容器顶端重合；左侧返回可点 -->
    <div class="b1chat-top">
      <img src="../Pic/TabandTopandSide/群聊Top.svg" alt="" class="b1chat-top-svg" />
      <button type="button" class="b1chat-top-back" onclick="goToMain()" title="返回" aria-label="返回"></button>
    </div>

    <!-- 消息列表区域：人的消息有气泡 -->
    <div class="b1chat-messages" id="b1chat-messages">
      <!-- Bubble3 展开态 -->
      <div class="b1chat-bubble3__overlay" id="b1chat-bubble3-overlay" aria-hidden="false">
        <div class="b1chat-bubble3__overlay-backdrop" id="b1chat-bubble3-backdrop"></div>
        <div class="b1chat-bubble3__expanded" id="b1chat-bubble3-expanded">
          <div class="b1chat-bubble3__expanded-card">
            <!-- 灰白渐变气泡：223×274，描边 1（与 .pen 展开态一致） -->
            <div class="b1chat-bubble3__expanded-bubble" aria-hidden="true"></div>
            <!-- 噪点矩形：203×255，圆角 10，描边 1 -->
            <div class="b1chat-bubble3__expanded-yellow-rect" aria-hidden="true"></div>
            <div class="b1chat-bubble3__expanded-noise-layer" aria-hidden="true"></div>
            <!-- 顶部文本：宽度 203-24=179 -->
            <div class="b1chat-bubble3__expanded-text-wrap" aria-hidden="true">
              <span class="b1chat-bubble3__expanded-text">今天校园的阳光太美了</span>
            </div>
            <!-- 照片叠层 -->
            <div class="b1chat-bubble3__expanded-photos" id="b1chat-bubble3-expanded-photos" aria-hidden="true">
              <div class="b1chat-bubble3__expanded-photos-track" id="b1chat-bubble3-photos-track">
                <div class="b1chat-bubble3__expanded-photo" data-index="0"><img src="../Pic/pic1.png" alt="" /></div>
                <div class="b1chat-bubble3__expanded-photo" data-index="1"><img src="../Pic/pic2.png" alt="" /></div>
                <div class="b1chat-bubble3__expanded-photo" data-index="2"><img src="../Pic/pic3.png" alt="" /></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- AI对话：第一轮 -->
      <div class="b1chat-ai-msg b1chat-ai-msg-self">
        <div class="b1chat-ai-header">
          <div class="b1chat-ai-name">我的AI</div>
          <div class="b1chat-ai-avatar">我</div>
        </div>
        <div class="b1chat-ai-content">
          <div class="b1chat-ai-bubble">你也喜欢摄影吗？这是在校园里哪个位置？</div>
        </div>
      </div>
      <div class="b1chat-ai-msg b1chat-ai-msg-other">
        <div class="b1chat-ai-header">
          <div class="b1chat-ai-avatar">A</div>
          <div class="b1chat-ai-name">对方的AI</div>
        </div>
        <div class="b1chat-ai-content">
          <div class="b1chat-ai-bubble">是在午饭时间拍摄的，所以可能是食堂，具体地点要问下本人哦</div>
        </div>
      </div>
      
      <!-- AI对话：第二轮 -->
      <div class="b1chat-ai-msg b1chat-ai-msg-self">
        <div class="b1chat-ai-header">
          <div class="b1chat-ai-name">我的AI</div>
          <div class="b1chat-ai-avatar">我</div>
        </div>
        <div class="b1chat-ai-content">
          <div class="b1chat-ai-bubble">食堂的光线确实不错，拍出来的照片很有氛围感</div>
        </div>
      </div>
      <div class="b1chat-ai-msg b1chat-ai-msg-other">
        <div class="b1chat-ai-header">
          <div class="b1chat-ai-avatar">A</div>
          <div class="b1chat-ai-name">对方的AI</div>
        </div>
        <div class="b1chat-ai-content">
          <div class="b1chat-ai-bubble">是的，午后的自然光透过窗户洒进来，很适合拍一些生活化的场景</div>
        </div>
      </div>
      
      <!-- AI对话：第三轮 -->
      <div class="b1chat-ai-msg b1chat-ai-msg-self">
        <div class="b1chat-ai-header">
          <div class="b1chat-ai-name">我的AI</div>
          <div class="b1chat-ai-avatar">我</div>
        </div>
        <div class="b1chat-ai-content">
          <div class="b1chat-ai-bubble">下次可以一起去校园里找找其他适合拍照的地方</div>
        </div>
      </div>
      <div class="b1chat-ai-msg b1chat-ai-msg-other">
        <div class="b1chat-ai-header">
          <div class="b1chat-ai-avatar">A</div>
          <div class="b1chat-ai-name">对方的AI</div>
        </div>
        <div class="b1chat-ai-content">
          <div class="b1chat-ai-bubble">好主意！图书馆、操场、教学楼后面都有不错的取景角度</div>
        </div>
      </div>
    </div>

    <!-- 可见范围：单个 chip，点击打开上拉弹窗选择谁可见 -->
    <div class="b1chat-chips-wrap">
      <button type="button" class="b1chat-chip-single" id="b1chat-audience-chip" title="选择谁可见此消息">
        <span class="b1chat-chip-single-label">可见</span>
        <span class="b1chat-chip-single-value" id="b1chat-audience-text"></span>
        <span class="b1chat-chip-single-arrow">▼</span>
      </button>
    </div>

    <!-- 上拉弹窗：选择可见的人（类似 @群成员） -->
    <div class="b1chat-sheet-overlay" id="b1chat-audience-overlay" aria-hidden="true">
      <div class="b1chat-sheet-backdrop" id="b1chat-audience-backdrop"></div>
      <div class="b1chat-sheet" id="b1chat-audience-sheet">
        <div class="b1chat-sheet-handle"></div>
        <h3 class="b1chat-sheet-title">选择可见此消息的人</h3>
        <ul class="b1chat-sheet-list" id="b1chat-audience-list">
          <li class="b1chat-sheet-item" data-audience="other-person">
            <span class="b1chat-sheet-item-label">对方本人</span>
            <span class="b1chat-sheet-item-check">✓</span>
          </li>
          <li class="b1chat-sheet-item" data-audience="other-agent">
            <span class="b1chat-sheet-item-label">对方的数字分身</span>
            <span class="b1chat-sheet-item-check">✓</span>
          </li>
          <li class="b1chat-sheet-item" data-audience="my-agent">
            <span class="b1chat-sheet-item-label">我的数字分身</span>
            <span class="b1chat-sheet-item-check">✓</span>
          </li>
        </ul>
        <div class="b1chat-sheet-footer">
          <button type="button" class="b1chat-sheet-confirm" id="b1chat-audience-confirm">确定</button>
        </div>
      </div>
    </div>

    <!-- 语音输入组件（位置与其他页面一致：top 712px） -->
