<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="数字分身注册流程" />
  <link rel="manifest" href="/manifest.json" />
  <title>注册流程 Register2</title>
  <link rel="stylesheet" href="register2.css">
</head>
<body>
  <div class="register2-container">
    <div class="page-wrapper">
      <!-- R1 页面 -->
      <div class="page page-1 active" data-page="1">
        <div class="page-content page-1-content">
          <!-- R1 背景图片 -->
          <div class="page-background">
            <img src="../Pic/Register/渐变背景.jpg" alt="背景" class="page-background-image" />
          </div>
          
          <!-- R1 Header -->
          <div class="r1-header">
            <img src="../Pic/Register/R2/header.svg" alt="Header" class="r1-header-svg" />
            <!-- Header文字1：数字分身 -->
            <span id="header文字1" class="header-text-1">数字分身</span>
          </div>
          <!-- R1 左上角返回按钮：跳转到主界面 -->
          <div class="r1-back-button" onclick="goToMainInterface()" title="返回主界面"></div>
          <!-- R1 AI说 SVG -->
          <div class="r1-ai-say">
            <img src="../Pic/Register/R1AI说.svg" alt="AI说" class="r1-ai-say-svg" />
          </div>
          
          <!-- R1 头像 -->
          <div class="r1-avatar">
            <img src="../Pic/Register/头像.svg" alt="头像" class="r1-avatar-svg" />
          </div>
          
          <!-- R1 眼睛 -->
          <svg class="r1-eyes-container" viewBox="0 0 360 793" xmlns="http://www.w3.org/2000/svg">
            <!-- 渐变定义 -->
            <defs>
              <linearGradient id="r1-eye-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E1B8E6;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
              </linearGradient>
            </defs>
            <!-- 左眼：线段长度14，中心在(172.5, 206.5) -->
            <line class="r1-eye r1-eye-left" 
                  x1="172.5" y1="199.5" 
                  x2="172.5" y2="213.5" 
                  stroke="#000000" 
                  stroke-width="8" 
                  stroke-linecap="round" />
            <!-- 右眼：线段长度14，中心在(187.5, 206.5)，距离左眼15 -->
            <line class="r1-eye r1-eye-right" 
                  x1="187.5" y1="199.5" 
                  x2="187.5" y2="213.5" 
                  stroke="#000000" 
                  stroke-width="8" 
                  stroke-linecap="round" />
          </svg>
          
          <!-- R1 输入框 -->
          <div class="r1-input">
            <img src="../Pic/Register/R1输入框.svg" alt="输入框" class="r1-input-svg" />
          </div>
          
          <!-- R1 输入框可点击区域（独立定位） -->
          <div class="r1-input-clickable" onclick="openR1Input()"></div>
          
          <!-- R1 分身名称显示文本 -->
          <div id="r1-avatar-name-display" class="r1-avatar-name-display"></div>
          
          <!-- R1 隐藏的输入框 -->
          <input type="text" 
                 id="r1-avatar-name-input" 
                 class="r1-avatar-name-input" 
                 placeholder="" 
                 style="display: none;" />
          
          <!-- R1 用户称呼下拉菜单 -->
          <div class="r1-title-selector">
            <!-- 下拉菜单触发器 -->
            <div id="r1-title-trigger" class="r1-title-trigger" onclick="toggleR1TitleMenu()">
              <div class="r1-title-trigger-content">
                <!-- 触发器内容为空，箭头单独定位 -->
              </div>
            </div>
            <!-- 下拉菜单选项 -->
            <div id="r1-title-menu" class="r1-title-menu">
              <div class="r1-title-option" data-value="1" onclick="selectR1Title(1)">
                <span class="r1-title-option-text">本人-正式通用的称呼</span>
              </div>
              <div class="r1-title-option" data-value="2" onclick="selectR1Title(2)">
                <span class="r1-title-option-text">本尊-威风凛凛的称呼</span>
              </div>
              <div class="r1-title-option" data-value="3" onclick="selectR1Title(3)">
                <span class="r1-title-option-text">正主-娱乐有趣的称呼</span>
              </div>
            </div>
          </div>
          
          <!-- R1 下拉箭头（单独定位，保持位置不变） -->
          <svg id="r1-title-arrow" class="r1-title-arrow" width="12" height="8" viewBox="0 0 12 8" xmlns="http://www.w3.org/2000/svg" onclick="toggleR1TitleMenu()">
            <path d="M1 1 L6 6 L11 1" stroke="rgba(0, 0, 0, 0.38)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          
          <!-- R1 用户称呼显示文本 -->
          <div id="r1-user-title-display" class="r1-user-title-display"></div>
          
          <!-- R1 称呼简短文本（根据选项显示"本人"/"本尊"/"正主"） -->
          <div id="r1-title-short-display" class="r1-title-short-display">本人</div>
          
          <!-- R1 进度点 -->
          <div class="r1-progress-dots">
            <div class="r1-progress-dot active" data-page="1"></div>
            <div class="r1-progress-dot" data-page="2"></div>
            <div class="r1-progress-dot" data-page="3"></div>
            <div class="r1-progress-dot" data-page="4"></div>
            <div class="r1-progress-dot" data-page="5"></div>
          </div>
          
          <!-- R1 按钮 -->
          <div id="r1-next-button" class="r1-button r1-button-disabled" onclick="handleR1NextButtonClick()">
            <img src="../Pic/Register/下一步按钮.svg" alt="按钮" class="r1-button-svg" />
          </div>
          
          <!-- R1 内容层 -->
          <div class="page-content-layer">
          </div>
        </div>
      </div>
      
      <!-- R2 页面 -->
      <div class="page page-2" data-page="2">
        <div class="page-content page-2-content">
          <!-- R2 背景图片 -->
          <div class="page-background">
            <img src="../Pic/Register/渐变背景.jpg" alt="背景" class="page-background-image" />
          </div>
          
          <!-- R2 Header -->
          <div class="r2-header">
            <img src="../Pic/Register/R2/header.svg" alt="Header" class="r2-header-svg" />
            <!-- Header文字：分身名称（使用R1输入的变量） -->
            <span id="r2-header-avatar-name" class="r2-header-avatar-name"></span>
          </div>
          
          <!-- R2 返回按钮（独立元素，不受header的pointer-events影响） -->
          <div class="r2-back-button" onclick="goToPrevPage()"></div>
          
          <!-- R2 AI说 SVG -->
          <div class="r2-ai-say">
            <img src="../Pic/Register/R2/R2AI说.svg" alt="AI说" class="r2-ai-say-svg" />
          </div>
          
          <!-- R2 头像容器 -->
          <div class="r2-avatar-eyes-container">
            <!-- R2 头像 -->
            <div class="r2-avatar">
              <img src="../Pic/Register/头像.svg" alt="头像" class="r2-avatar-svg" />
            </div>
          </div>
          
          <!-- R2 眼睛（独立容器，确保在最顶层） -->
          <svg class="r2-eyes-container" viewBox="0 0 360 793" xmlns="http://www.w3.org/2000/svg">
            <!-- 渐变定义 -->
            <defs>
              <linearGradient id="r2-eye-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E1B8E6;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
              </linearGradient>
            </defs>
            <!-- 左眼：线段长度14，中心在(172.5, 206.5)，放大后间距约32.7px -->
            <line class="r2-eye r2-eye-left" 
                  x1="172.5" y1="199.5" 
                  x2="172.5" y2="213.5" 
                  stroke="#000000" 
                  stroke-width="8" 
                  stroke-linecap="round" />
            <!-- 右眼：线段长度14，中心在(205.2, 206.5)，距离左眼32.7px（15*2.18） -->
            <line class="r2-eye r2-eye-right" 
                  x1="205.2" y1="199.5" 
                  x2="205.2" y2="213.5" 
                  stroke="#000000" 
                  stroke-width="8" 
                  stroke-linecap="round" />
          </svg>
          
          <!-- R2 进度点 -->
          <div class="r2-progress-dots">
            <div class="r2-progress-dot" data-page="1"></div>
            <div class="r2-progress-dot active" data-page="2"></div>
            <div class="r2-progress-dot" data-page="3"></div>
            <div class="r2-progress-dot" data-page="4"></div>
            <div class="r2-progress-dot" data-page="5"></div>
          </div>
          
          <!-- R2 自动生成按钮 -->
          <div class="r2-auto-generate-button" onclick="goToR3()">
            <img src="../Pic/Register/R2/自动生成按钮.svg" alt="自动生成" class="r2-auto-generate-button-svg" />
          </div>
          
          <!-- R2 拍照按钮 -->
          <div class="r2-camera-button" onclick="openCameraInterface()">
            <img src="../Pic/Register/R2/拍照按钮.svg" alt="拍照" class="r2-camera-button-svg" />
          </div>
          
          <!-- R2 内容层 -->
          <div class="page-content-layer">
          </div>
        </div>
      </div>
      
      <!-- 拍照界面 -->
      <div id="camera-interface" class="camera-interface">
        <!-- 相机预览容器 -->
        <div class="camera-preview-container">
          <!-- 背景渐变层（在容器内，受overflow限制） -->
          <div class="camera-background">
            <div class="camera-gradient"></div>
            <div class="camera-dot-pattern"></div>
          </div>
          
          <video id="camera-preview" class="camera-preview" autoplay playsinline></video>
          <canvas id="camera-canvas" class="camera-canvas"></canvas>
          <!-- 扫描线动画 -->
          <div class="camera-scan-line"></div>
        </div>
        
        <!-- 控制按钮区域 -->
        <div class="camera-controls">
          <!-- 拍摄按钮（未拍摄时显示） -->
          <button id="camera-capture-btn" class="camera-btn camera-capture-btn" onclick="capturePhoto()">
            <div class="camera-btn-inner"></div>
          </button>
          
          <!-- 重拍和确定按钮（拍摄后显示） -->
          <div id="camera-review-btns" class="camera-review-btns" style="display: none;">
            <button class="camera-btn camera-retake-btn" onclick="retakePhoto()">重拍</button>
            <button class="camera-btn camera-confirm-btn" onclick="confirmPhoto()">确定</button>
          </div>
        </div>
        
        <!-- 关闭按钮 -->
        <button class="camera-close-btn" onclick="closeCameraInterface()">×</button>
      </div>
      
      <!-- R3 页面 -->
      <div class="page page-3" data-page="3">
        <div class="page-content page-3-content">
          <!-- R3 背景图片 -->
          <div class="page-background">
            <img src="../Pic/Register/渐变背景.jpg" alt="背景" class="page-background-image" />
          </div>
          
          <!-- R3 Header -->
          <div class="r3-header">
            <img src="../Pic/Register/R2/header.svg" alt="Header" class="r3-header-svg" />
            <!-- Header文字：分身名称（使用R1输入的变量） -->
            <span id="r3-header-avatar-name" class="r3-header-avatar-name"></span>
          </div>
          
          <!-- R3 返回按钮（独立元素，不受header的pointer-events影响） -->
          <div class="r3-back-button" onclick="goToPrevPage()"></div>
          
          <!-- R3 AI说 SVG -->
          <div class="r3-ai-say">
            <img src="../Pic/Register/R3/R3AI说.svg" alt="AI说" class="r3-ai-say-svg" />
          </div>
          
          <!-- R3 头像容器 -->
          <div class="r3-avatar-eyes-container">
            <!-- R3 头像 -->
            <div class="r3-avatar">
              <img src="../Pic/Register/R3/深色头像.svg" alt="头像" class="r3-avatar-svg" />
            </div>
          </div>
          
          <!-- R3 眼睛（独立容器，确保在最顶层） -->
          <svg class="r3-eyes-container" viewBox="0 0 360 793" xmlns="http://www.w3.org/2000/svg">
            <!-- 渐变定义 -->
            <defs>
              <linearGradient id="r3-eye-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E1B8E6;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
              </linearGradient>
            </defs>
            <!-- 左眼：使用path以便实现高兴动画 -->
            <path class="r3-eye r3-eye-left" 
                  d="M 172.5 199.5 L 172.5 213.5"
                  stroke="#000000" 
                  stroke-width="8" 
                  stroke-linecap="round"
                  fill="none" />
            <!-- 右眼：使用path以便实现高兴动画 -->
            <path class="r3-eye r3-eye-right" 
                  d="M 205.2 199.5 L 205.2 213.5"
                  stroke="#000000" 
                  stroke-width="8" 
                  stroke-linecap="round"
                  fill="none" />
          </svg>
          
          <!-- R3 进度点 -->
          <div class="r3-progress-dots">
            <div class="r3-progress-dot active" data-page="1"></div>
            <div class="r3-progress-dot active" data-page="2"></div>
            <div class="r3-progress-dot" data-page="3"></div>
            <div class="r3-progress-dot" data-page="4"></div>
            <div class="r3-progress-dot" data-page="5"></div>
          </div>
          
          <!-- R3 下一步按钮 -->
          <div id="r3-next-button" class="r3-button" onclick="handleR3NextButtonClick()">
            <img src="../Pic/Register/下一步按钮.svg" alt="下一步" class="r3-button-svg" />
          </div>
          
          <!-- R3 用户头像 -->
          <div class="r3-user-avatar" onclick="handleR3UserAvatarClick()">
            <img src="../Pic/Register/R3/用户头像.png" alt="用户头像" class="r3-user-avatar-img" />
          </div>
          
          <!-- R3 Load动画 -->
          <div class="r3-load-animation">
            <div class="r3-load-circle">
              <div class="r3-load-dot" style="--index: 0;"></div>
              <div class="r3-load-dot" style="--index: 1;"></div>
              <div class="r3-load-dot" style="--index: 2;"></div>
              <div class="r3-load-dot" style="--index: 3;"></div>
              <div class="r3-load-dot" style="--index: 4;"></div>
              <div class="r3-load-dot" style="--index: 5;"></div>
              <div class="r3-load-dot" style="--index: 6;"></div>
              <div class="r3-load-dot" style="--index: 7;"></div>
              <div class="r3-load-dot" style="--index: 8;"></div>
              <div class="r3-load-dot" style="--index: 9;"></div>
              <div class="r3-load-dot" style="--index: 10;"></div>
              <div class="r3-load-dot" style="--index: 11;"></div>
            </div>
          </div>
          
          <!-- R3 内容层 -->
          <div class="page-content-layer">
          </div>
        </div>
      </div>
      
      <!-- R4 页面 -->
      <div class="page page-4" data-page="4">
        <div class="page-content page-4-content">
          <!-- R4 背景图片 -->
          <div class="page-background">
            <img src="../Pic/Register/渐变背景.jpg" alt="背景" class="page-background-image" />
          </div>
          
          <!-- R4 Header -->
          <div class="r4-header">
            <img src="../Pic/Register/R2/header.svg" alt="Header" class="r4-header-svg" />
            <!-- Header文字：分身名称（使用R1输入的变量） -->
            <span id="r4-header-avatar-name" class="r4-header-avatar-name"></span>
          </div>
          
          <!-- R4 返回按钮（独立元素，不受header的pointer-events影响） -->
          <div class="r4-back-button" onclick="goToPrevPage()"></div>
          
          <!-- R4 头像和眼睛容器（作为一个整体） -->
          <div class="r4-avatar-eyes-wrapper">
            <!-- R4 头像（深色头像） -->
            <div class="r4-avatar">
              <img src="../Pic/Register/R3/深色头像.svg" alt="头像" class="r4-avatar-svg" />
            </div>
            
            <!-- R4 眼睛（复制R1的眼睛动画组合） -->
            <svg class="r4-eyes-container" viewBox="0 0 360 793" xmlns="http://www.w3.org/2000/svg">
              <!-- 渐变定义 -->
              <defs>
                <linearGradient id="r4-eye-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#E1B8E6;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
                </linearGradient>
              </defs>
              <!-- 左眼：线段长度14，中心在(172.5, 206.5) -->
              <line class="r4-eye r4-eye-left" 
                    x1="172.5" y1="199.5" 
                    x2="172.5" y2="213.5" 
                    stroke="#000000" 
                    stroke-width="8" 
                    stroke-linecap="round" />
              <!-- 右眼：线段长度14，中心在(187.5, 206.5)，距离左眼15 -->
              <line class="r4-eye r4-eye-right" 
                    x1="187.5" y1="199.5" 
                    x2="187.5" y2="213.5" 
                    stroke="#000000" 
                    stroke-width="8" 
                    stroke-linecap="round" />
            </svg>
          </div>
          
          <!-- R4 文本内容 -->
          <div class="r4-text-content">
            <div class="r4-text-title">现在，请让我了解你</div>
          </div>
          
          <!-- R4 对话区域容器 -->
          <div class="r4-chat-container">
            <!-- R4 AI初始消息（第二段文本） -->
            <div class="r4-ai-message r4-text-body">
              可以跟我聊聊你是一个怎样的人，来帮我注入灵魂。我们可以从你的经历开始聊起。<br><br>你觉得，童年时期发生了哪些事情，让你印象深刻？这些事情是否一定程度上改变了你？
            </div>
            
            <!-- R4 对话气泡容器 -->
            <div id="r4-messages-container" class="r4-messages-container"></div>
          </div>
          
          <!-- R4 进度点 -->
          <div class="r4-progress-dots">
            <div class="r4-progress-dot active" data-page="1"></div>
            <div class="r4-progress-dot active" data-page="2"></div>
            <div class="r4-progress-dot active" data-page="3"></div>
            <div class="r4-progress-dot" data-page="4"></div>
            <div class="r4-progress-dot" data-page="5"></div>
          </div>
          
          <!-- R4 语音输入组件（与下方原 SVG 顶端位置一致：top 712px） -->
          <div class="r4-voice-wrap" id="r4-voice-wrap">
            <div class="r4-voice-layer r4-voice-idle" id="r4-voice-idle">
              <img src="../Pic/Register/R4/小艺语音输入-常规态.svg" alt="" width="334" height="90" />
          </div>
            <div class="r4-voice-layer r4-voice-recording" id="r4-voice-recording">
              <img src="../Pic/Register/R5/按住说.svg" alt="" width="320" height="125" />
              <div class="r4-voice-wave-container" id="r4-voice-wave-container">
                <svg id="r4-voice-wave-svg" width="192" height="20" viewBox="0 0 192 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="r4-voice-wave-g1" x1="-2.56" y1="9.9" x2="191" y2="12" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#FFC629"/><stop offset="0.265" stop-color="#FF5757"/><stop offset="0.52" stop-color="#FF42D2"/><stop offset="1" stop-color="#1FD0EE"/>
                    </linearGradient>
                    <linearGradient id="r4-voice-wave-g2" x1="-7.26" y1="22.6" x2="191" y2="22.6" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#F748DA"/><stop offset="1" stop-color="#1FD0EE"/>
                    </linearGradient>
                  </defs>
                  <path class="r4-voice-wave-bar" data-index="0" fill-rule="evenodd" clip-rule="evenodd" d="M3 11C3 11.552 2.5523 12 2 12C1.4477 12 1 11.552 1 11V9C1 8.448 1.4477 8 2 8C2.5523 8 3 8.448 3 9V11Z" fill="url(#r4-voice-wave-g1)"/>
                  <path class="r4-voice-wave-bar" data-index="1" fill-rule="evenodd" clip-rule="evenodd" d="M6 12C6.5523 12 7 11.552 7 11V9C7 8.448 6.5523 8 6 8C5.4477 8 5 8.448 5 9V11C5 11.552 5.4477 12 6 12Z" fill="url(#r4-voice-wave-g1)"/>
                  <path class="r4-voice-wave-bar" data-index="2" fill-rule="evenodd" clip-rule="evenodd" d="M11 11C11 11.552 10.552 12 10 12C9.4477 12 9 11.552 9 11V9C9 8.448 9.4477 8 10 8C10.552 8 11 8.448 11 9V11Z" fill="url(#r4-voice-wave-g1)"/>
                  <path class="r4-voice-wave-bar" data-index="3" fill-rule="evenodd" clip-rule="evenodd" d="M15 11C15 11.552 14.552 12 14 12C13.448 12 13 11.552 13 11V9C13 8.448 13.448 8 14 8C14.552 8 15 8.448 15 9V11Z" fill="url(#r4-voice-wave-g1)"/>
                  <path class="r4-voice-wave-bar" data-index="4" fill-rule="evenodd" clip-rule="evenodd" d="M18 12C18.552 12 19 11.552 19 11V9C19 8.448 18.552 8 18 8C17.448 8 17 8.448 17 9V11C17 11.552 17.448 12 18 12Z" fill="url(#r4-voice-wave-g1)"/>
