<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API测试页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>API连接测试</h1>
  
  <div id="status"></div>
  
  <button onclick="testAPI()">测试API连接</button>
  <button onclick="testRailway()">测试Railway</button>
  
  <div id="results"></div>

  <script>
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000'
      : 'https://square22-demo-production.up.railway.app';

    function addStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusDiv.appendChild(div);
    }

    async function testRailway() {
      addStatus('正在测试Railway连接...', 'info');
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时
        
        const response = await fetch(`${API_BASE_URL}/health`, {
          method: 'GET',
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok) {
          const data = await response.json();
          addStatus(`✅ Railway连接成功: ${JSON.stringify(data)}`, 'success');
        } else {
          addStatus(`❌ Railway返回错误: ${response.status} ${response.statusText}`, 'error');
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          addStatus('❌ Railway连接超时（10秒）', 'error');
        } else {
          addStatus(`❌ Railway连接失败: ${error.message}`, 'error');
        }
      }
    }

    async function testAPI() {
      addStatus('正在测试API...', 'info');
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); // 15秒超时
        
        const response = await fetch(`${API_BASE_URL}/api/claude`, {
          method: 'POST',
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            messages: [{ role: 'user', content: 'Hello' }]
          }),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        const text = await response.text();
        addStatus(`API响应状态: ${response.status}`, response.ok ? 'success' : 'error');
        addStatus(`响应内容: ${text.substring(0, 200)}`, 'info');
      } catch (error) {
        if (error.name === 'AbortError') {
          addStatus('❌ API请求超时（15秒）', 'error');
        } else {
          addStatus(`❌ API请求失败: ${error.message}`, 'error');
        }
      }
    }

    // 页面加载时显示信息
    window.addEventListener('DOMContentLoaded', () => {
      addStatus(`当前域名: ${window.location.hostname}`, 'info');
      addStatus(`API地址: ${API_BASE_URL}`, 'info');
      addStatus(`User Agent: ${navigator.userAgent}`, 'info');
    });
  </script>
</body>
</html>
