<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>语音交互预览 · 三态（空白 / 正在输入 / 呈现）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 18px; color: #333; margin-bottom: 8px; }
    .hint { font-size: 14px; color: #666; margin-bottom: 24px; }

    .voice-strip-wrap {
      position: relative;
      width: 334px;
      height: 125px;
      margin: 0 auto;
    }
    .voice-strip-wrap .state-layer {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      display: none;
      pointer-events: none;
    }
    .voice-strip-wrap .state-layer.active { display: block; }
    /* 按下输入态：整体上移 51px */
    .voice-strip-wrap .state-layer.state-recording.active {
      transform: translateX(-50%) translateY(-51px);
    }
    .voice-strip-wrap .state-layer.state-result.active {
      z-index: 15;
      pointer-events: auto;
    }
    .voice-strip-wrap .state-layer img { display: block; vertical-align: top; }
    .voice-strip-wrap .voice-hit {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* 呈现态时隐藏主热区，改由结果层接收点击（右侧按钮可点） */
    .voice-strip-wrap.voice-state-result .voice-hit {
      display: none;
    }

    /* 正在输入：R5 声波纹容器，始终显示；无声音时小条等长 2px，有声音时随音量变化；上移 50px */
    .preview-voice-wave-container {
      position: absolute;
      left: 50%;
      bottom: 58px;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      opacity: 1;
    }
    .preview-voice-wave-container svg {
      display: block;
      width: 192px;
      height: 20px;
    }
    .preview-voice-wave-container .preview-wave-bar {
      transition: transform 0.08s ease-out;
      transform-origin: center center;
    }

    /* 呈现状态：参考 R4 下方文字+发送按钮布局；整体内容下移 10px */
    .state-result .result-inner {
      position: relative;
      width: 314px;
      min-height: 73px;
      transform: translateY(10px);
    }
    .state-result .result-inner .result-svg-wrap {
      position: relative;
      width: 314px;
      height: 73px;
    }
    .state-result .result-inner .result-svg-wrap img {
      display: block;
      width: 314px;
      height: 73px;
    }
    /* 文字区域：与 R4 一致，右移 20、再上移 5 */
    .state-result .result-text-wrap {
      position: absolute;
      left: 44px;
      top: calc(50% - 10px);
      transform: translateY(-50%);
      width: 215px;
      max-height: 36px;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: "HarmonyOS Sans SC Bold", "PingFang SC Bold", "Microsoft YaHei Bold", sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: rgba(0, 0, 0, 0.38);
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    .state-result .result-text-wrap::-webkit-scrollbar { width: 4px; }
    .state-result .result-text-wrap::-webkit-scrollbar-track { background: transparent; }
    .state-result .result-text-wrap::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.38);
      border-radius: 2px;
    }
    .state-result .result-text-wrap:empty::before {
      content: "未识别到内容";
      color: #999;
    }
    /* 发送按钮：与 R4 同款，再上移 2（仅此按钮点击返回空白） */
    .state-result .result-send-btn {
      position: absolute;
      right: 11px;
      top: calc(50% - 12px);
      transform: translateY(-50%);
      width: 23px;
      height: 23px;
      cursor: pointer;
      z-index: 2;
      transition: opacity 0.2s ease;
    }
    .state-result .result-send-btn:hover { opacity: 0.8; }
    .state-result .result-send-btn:active { opacity: 0.6; }
    .state-result .result-send-btn svg { display: block; width: 100%; height: 100%; }
    /* 最左侧按钮：点击返回空白状态 */
    .state-result .result-back-btn {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      cursor: pointer;
      z-index: 2;
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #999;
      min-height: 1.2em;
    }
  </style>
</head>

    <div class="state-layer state-result" id="layer-result">
      <div class="result-inner">
        <div class="result-svg-wrap">
          <img src="../Pic/Register/R4/小艺语音输入-文本输入 (1).svg" alt="" width="314" height="73" />
          <div class="result-text-wrap" id="result-text"></div>
          <div class="result-back-btn" id="result-back-btn" title="返回空白状态" aria-label="返回空白"></div>
          <div class="result-send-btn" id="result-send-btn" title="发送" aria-label="发送">
            <svg width="23" height="23" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="preview-send-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />

                </linearGradient>
              </defs>
              <circle cx="11.5" cy="11.5" r="11" fill="none" stroke="url(#preview-send-gradient)" stroke-width="1"/>
              <path d="M11.5 6L16 11.5L11.5 17M16 11.5H6" stroke="url(#preview-send-gradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <div class="status" id="status"></div>

  <script>
    (function () {
      const layerIdle = document.getElementById('layer-idle');
      const layerRecording = document.getElementById('layer-recording');
      const layerResult = document.getElementById('layer-result');
      const resultText = document.getElementById('result-text');
      const hit = document.getElementById('voice-hit');
      const statusEl = document.getElementById('status');
      const previewWaveSvg = document.getElementById('preview-voice-wave-svg');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusEl.textContent = '当前浏览器不支持语音识别，请使用 Chrome 等支持 Web Speech API 的浏览器。';
        hit.style.pointerEvents = 'none';
        setState('result');
        resultText.textContent = '不支持语音识别';
        return;
      }

      let recognition = null;
      let isListening = false;
      let finalTranscript = '';
      let holdTimer = null;
      let previewWaveBars = [];
      let previewWaveAnimId = null;
      let previewMicStream = null;
      let previewAudioContext = null;
      let previewAnalyser = null;
      let previewFreqData = null;
      const PREVIEW_BASE_HEIGHT = 2;
      const PREVIEW_MIN_H = 1;
      const PREVIEW_MAX_H = 16;
      const PREVIEW_VISIBLE_BARS = 48;
      const PREVIEW_VOLUME_THRESHOLD = 18;
      const previewWaveContainer = document.getElementById('preview-voice-wave-container');

      function setState(state) {
        layerIdle.classList.remove('active');
        layerRecording.classList.remove('active');
        layerResult.classList.remove('active');
        if (state === 'idle') {
          layerIdle.classList.add('active');
          statusEl.textContent = '点击并按住开始说话';
          stopPreviewWave();
          hit.parentElement.classList.remove('voice-state-result');
          hit.style.display = '';
        } else if (state === 'recording') {
          layerRecording.classList.add('active');
          statusEl.textContent = '正在听… 松开结束';
          previewHasVoice = false;
          hit.parentElement.classList.remove('voice-state-result');
          hit.style.display = '';
          initPreviewWave();
          runPreviewWaveLoop();
        } else {
          layerResult.classList.add('active');
          statusEl.textContent = '识别完成，可再次按住说话';
          stopPreviewWave();
          hit.parentElement.classList.add('voice-state-result');
        }
      }

      function setStatus(text) { statusEl.textContent = text; }

      function initPreviewWave() {
        if (!previewWaveSvg) return;
        previewWaveBars = Array.from(previewWaveSvg.querySelectorAll('.preview-wave-bar'));
        previewWaveBars.forEach(function (bar) { bar.style.transform = 'scaleY(1)'; });
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          previewMicStream = stream;
          previewAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          previewAnalyser = previewAudioContext.createAnalyser();
          previewAnalyser.fftSize = 256;
          previewAnalyser.smoothingTimeConstant = 0.6;
          previewAnalyser.connect(previewAudioContext.destination);
          var source = previewAudioContext.createMediaStreamSource(stream);
          source.connect(previewAnalyser);
          previewFreqData = new Uint8Array(previewAnalyser.frequencyBinCount);
        }).catch(function () {
          previewFreqData = null;
        });
      }

      function runPreviewWaveLoop() {
        if (previewWaveAnimId != null) return;
        function animate() {
          if (!layerRecording.classList.contains('active')) {
            previewWaveAnimId = null;
            return;
          }
          var avg = 0;
          var binPerBar = 0;
          if (previewAnalyser && previewFreqData && previewFreqData.length) {
            previewAnalyser.getByteFrequencyData(previewFreqData);
            for (var i = 0; i < previewFreqData.length; i++) avg += previewFreqData[i];
            avg = avg / previewFreqData.length;
            binPerBar = Math.max(1, Math.floor(previewFreqData.length / PREVIEW_VISIBLE_BARS));
          }
          previewWaveBars.forEach(function (bar, index) {
            var barIndex = index % PREVIEW_VISIBLE_BARS;
            if (avg < PREVIEW_VOLUME_THRESHOLD || !previewFreqData || !binPerBar) {
              bar.style.transform = 'scaleY(1)';
              return;
            }
            var sum = 0;
            var start = barIndex * binPerBar;
            var end = Math.min(start + binPerBar, previewFreqData.length);
            for (var j = start; j < end; j++) sum += previewFreqData[j];
            var val = end > start ? sum / (end - start) : 0;
            var normalized = Math.min(255, val) / 255;
            var h = PREVIEW_MIN_H + normalized * (PREVIEW_MAX_H - PREVIEW_MIN_H);
            var scaleY = h / PREVIEW_BASE_HEIGHT;
            bar.style.transform = 'scaleY(' + scaleY + ')';
          });
          previewWaveAnimId = requestAnimationFrame(animate);
        }
        animate();
      }

      function stopPreviewWave() {
        if (previewWaveAnimId != null) {
          cancelAnimationFrame(previewWaveAnimId);
          previewWaveAnimId = null;
        }
        previewWaveBars.forEach(function (bar) { bar.style.transform = 'scaleY(1)'; });
        if (previewMicStream) {
          previewMicStream.getTracks().forEach(function (t) { t.stop(); });
          previewMicStream = null;
        }
        if (previewAudioContext) {
          previewAudioContext.close().catch(function () {});
          previewAudioContext = null;
        }
        previewAnalyser = null;
        previewFreqData = null;
      }

      function startListening() {
        if (isListening) return;
        finalTranscript = '';
        previewHasVoice = false;
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function () {
          isListening = true;
          setState('recording');
        };
        recognition.onresult = function (e) {
          var any = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            var transcript = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              finalTranscript += transcript;
            } else {
              any += transcript;
            }
          }
          if (any || finalTranscript) previewHasVoice = true;
          if (any) resultText.textContent = finalTranscript + any;
        };
        recognition.onend = function () {
          isListening = false;
          if (finalTranscript) resultText.textContent = finalTranscript;
          setState('result');
          setStatus('识别结束');
        };
        recognition.onerror = function (e) {
          isListening = false;
          setStatus('识别错误: ' + (e.error || '未知'));
          setState('result');
          if (!resultText.textContent) resultText.textContent = '识别出错';
        };

        try { recognition.start(); } catch (err) {
          setStatus('启动失败: ' + err.message);
          setState('result');
        }
      }

      function stopListening() {
        if (!recognition || !isListening) return;
        try { recognition.stop(); } catch (_) {}
      }

      function onPointerDown(e) {
        e.preventDefault();
        if (layerResult.classList.contains('active')) {
          resultText.textContent = '';
          holdTimer = setTimeout(function () {
            holdTimer = null;
            startListening();
          }, 300);
          return;
        }
        startListening();
      }

      function onPointerUp(e) {
        e.preventDefault();
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
          return;
        }
        stopListening();
      }

      hit.addEventListener('mousedown', onPointerDown);
      hit.addEventListener('mouseup', onPointerUp);
      hit.addEventListener('mouseleave', onPointerUp);
      hit.addEventListener('touchstart', function (e) { e.preventDefault(); onPointerDown(e); }, { passive: false });
      hit.addEventListener('touchend', function (e) { e.preventDefault(); onPointerUp(e); }, { passive: false });
      hit.addEventListener('touchcancel', function (e) { e.preventDefault(); onPointerUp(e); });

      layerResult.addEventListener('mousedown', function (e) {
        if (e.target.closest('.result-send-btn') || e.target.closest('.result-back-btn')) return;
        if (e.target.closest('.result-text-wrap')) return;
        onPointerDown(e);
      });
      layerResult.addEventListener('mouseup', onPointerUp);
      layerResult.addEventListener('mouseleave', onPointerUp);
      layerResult.addEventListener('touchstart', function (e) {
        if (e.target.closest('.result-send-btn') || e.target.closest('.result-back-btn')) return;
        if (e.target.closest('.result-text-wrap')) return;
        e.preventDefault();
        onPointerDown(e);
      }, { passive: false });
      layerResult.addEventListener('touchend', function (e) { e.preventDefault(); onPointerUp(e); }, { passive: false });
      layerResult.addEventListener('touchcancel', function (e) { e.preventDefault(); onPointerUp(e); }, { passive: false });

      document.getElementById('result-send-btn').addEventListener('click', function (e) {
        e.stopPropagation();
      });

      document.getElementById('result-back-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        e.preventDefault();
        resultText.textContent = '';
        setState('idle');
        setStatus('点击并按住开始说话');
      });

      setState('idle');
    })();
  </script>
