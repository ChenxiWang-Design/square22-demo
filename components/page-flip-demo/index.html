<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>读书翻页演示（StPageFlip / page-flip）</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
  <h1>StPageFlip：拖拽书角翻页，内容随页翻动（固定尺寸、无依赖）</h1>
  <p class="hint">与 Turn.js 对比见 <a href="README.md">README.md</a></p>

  <div class="book-container">
    <div class="flip-book" id="flipbook">
      <div class="page page-cover page-cover-top" data-density="hard">
        <div class="page-content">
          <span class="page-label">封面</span>
        </div>
      </div>
      <div class="page">
        <div class="page-content">
          <span class="page-label">第 1 页</span>
          <p class="page-text">第一页内容。拖拽右侧书角可翻页。</p>
        </div>
      </div>
      <div class="page">
        <div class="page-content">
          <span class="page-label">第 2 页</span>
          <p class="page-text">第二页内容。书角可自由卷曲。</p>
        </div>
      </div>
      <div class="page">
        <div class="page-content">
          <span class="page-label">第 3 页</span>
          <p class="page-text">第三页内容。</p>
        </div>
      </div>
      <div class="page page-cover page-cover-bottom" data-density="hard">
        <div class="page-content">
          <span class="page-label">封底</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="demo.js"></script>
</body>
</html>
