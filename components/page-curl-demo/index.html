<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翻书效果演示（Turn.js）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e5e5e5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; }
    h1 { font-size: 14px; color: #666; margin-bottom: 16px; }
    #flipbook { box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    #flipbook .page { background: #f5f0e6; }
    #flipbook .page .gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #flipbook .even .gradient { background: linear-gradient(left, rgba(0,0,0,0) 92%, rgba(0,0,0,0.12) 100%); }
    #flipbook .odd .gradient { background: linear-gradient(right, rgba(0,0,0,0) 92%, rgba(0,0,0,0.12) 100%); }
  </style>
</head>
<body>
  <h1>拖拽书角或页面边缘翻页（Turn.js 仿真翻书）</h1>
  <div id="flipbook">
    <div class="hard"></div>
    <div class="hard"></div>
    <div class="page even"><div class="gradient"></div></div>
    <div class="page odd"><div class="gradient"></div></div>
    <div class="page even"><div class="gradient"></div></div>
    <div class="page odd"><div class="gradient"></div></div>
    <div class="hard"></div>
    <div class="hard"></div>
  </div>

  <script src="jquery.min.js"></script>
  <script src="turn.min.js"></script>
  <script>
    $(function () {
      if (typeof $.fn.turn !== "undefined") {
        $("#flipbook").turn({
          width: 320,
          height: 440,
          autoCenter: true,
          duration: 500,
          gradients: true
        });
      } else {
        document.body.innerHTML = "<p style='color:#c00; padding: 24px;'>Turn.js 未加载。请确保 jquery.min.js 与 turn.min.js 与本页同目录。</p>";
      }
    });
  </script>
</body>
</html>
