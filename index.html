<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />

  <link rel="manifest" href="/manifest.json" />
  <title>主界面 · Frame map 2</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-frame {
      width: 360px;
      height: 793px;
      flex-shrink: 0;
      position: relative;
      background: transparent url("Pic/Square/Vector Field Generator.jpg") 0 0 / 100% 100% no-repeat;
      overflow: hidden;
    }
    /* 岛屿 SVG 层：从下往上排列，居中对齐，z-index 在底图和气泡之间，整体放大 10% */
    .island-layer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) scale(1.1);
      z-index: 5;
      pointer-events: none;
      width: 0;
      height: 0;
      transition: transform 0.1s ease-out;
      /* 强制硬件加速 */
      backface-visibility: hidden;
      perspective: 1000px;
    }
    .island-layer.is-dragging {
      transition: none !important;
      will-change: transform;
    }
    .island-layer img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: block;
      max-width: none;
    }
    .island-color {
      z-index: 1;
      filter: blur(0);
      transition: filter 0.4s ease;
    }
    .island-color.is-blurred {
      filter: blur(30px);
    }
    .island-blur {
      z-index: 2;
      opacity: 0;
    }
    .island {
      z-index: 3;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .island.is-dimmed {
      opacity: 0.7;
    }
    /* islandText 不再居中对齐，改为绝对定位（位置由 JavaScript 动态计算） */
    .island-text {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(0, 0);
      z-index: 4;
      opacity: 0;
      transition: opacity 0.4s ease;
      display: block;
      max-width: none;
    }
    .island-text.is-visible {
      opacity: 1;
    }
    .tab-and-top {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      z-index: 15;
      opacity: 1;
      display: block;
      max-width: none;
      pointer-events: none;
    }
    .tab-and-top.state2-below-overlay {
      z-index: 15;
    }
    .start-button {
      position: absolute;
      left: 50%;
      top: 629px;
      transform: translateX(-50%);
      z-index: 15;
      opacity: 1;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    /* 状态2：60% 透明黑色遮罩，填充整个 main-frame */
    .state2-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 14;
      pointer-events: none;
      display: none;
    }
    .state2-overlay.is-visible {
      display: block;
      pointer-events: auto; /* 状态2 时遮罩接收点击，避免穿透到下方气泡 */
    }
    /* 状态2：自我介绍卡片，置于遮罩上方，中心点 X 与容器中轴对齐，Y=384 */
    .state2-intro-card {

      top: 384px;
      transform: translate(-50%, -50%);
      z-index: 16;
      display: none;

      display: block;
    }

    /* 状态2：自我介绍提示文本（分身说话区域），左上顶点 X32 Y627，宽 196，鸿蒙黑体 16px regular，黑色（状态2 上移 30） */

      top: 627px;

      pointer-events: none;

    .state2-intro-text.is-visible {
      display: block;
    }
    /* 状态2：自我介绍卡片内 SVG 自带的两个按钮用透明可点击层覆盖，尺寸与 SVG 内 rect 一致（viewBox 0 0 341 480） */

      pointer-events: auto;
    }
    .state2-intro-card .state2-intro-card-btn {
      position: absolute;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
    }
    .state2-intro-card .state2-intro-card-btn-skip {
      left: 8.69312px;
      top: 431.796px;
      width: 149.5px;
      height: 48px;
    }
    .state2-intro-card .state2-intro-card-btn-publish {
      left: 182.693px;
      top: 431.796px;
      width: 149.5px;
      height: 48px;
    }
    /* bubble4：默认隐藏，仅当用户从 R6 进入广场且在状态2点击「发布」后才显示 */
    .main-frame .bubble-wrapper-bubble4.bubble4-hidden-until-published {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    /* 状态2：轮播对话（来自 bubble4 展开态），置顶显示，1.5 倍放大，向下 150px，视觉宽度 270px */
    .state2-carousel-wrap {
      position: absolute;

      top: 206px;

      z-index: 18;

      overflow: hidden;

    .state2-carousel-wrap.is-visible {

    /* 状态2：眼睛动画，置于 X46-314、Y420-513 区域内，置顶层级；容器留足余量避免上下左右移动时被裁切 */

      height: 100px;

    .state2-top-eyes.is-visible {

    }
    .state2-top-eyes svg {

      height: 793px;

    }
    .state2-top-eyes .state2-top-eye {

    .state2-top-eyes .state2-top-eye-left {

    /* 内容最大 180px，scale(1.5) 后视觉宽度 = 270px */
    .state2-carousel-content {
      font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #000000;
      text-align: center;
      word-break: break-word;
      opacity: 0;
      transition: opacity 0.3s ease;
      max-width: 180px;
      transform: scale(1.5);
      transform-origin: center center;

    .state2-carousel-content.is-visible {
      opacity: 1;
    }
    .state2-carousel-content.text-large {
      font-size: 24px;
      font-weight: bold;
      line-height: 1.2;
    }
    /* 广场对话框：R6 进入广场后替换创建数字分身按钮，相对于 main-frame 左上顶点 X14 Y603（状态2 整体上移 30，80(2) 不动） */
    .square-dialog {
      position: absolute;
      left: 14px;
      top: 603px;
      z-index: 15;
      display: none;
      pointer-events: auto;
      width: 339px;
      height: 92px;
    }
    .square-dialog.is-visible {
      display: block;
    }
    .square-dialog-svg {
      display: block;

    }
    .square-dialog img {

    }
    /* 状态2：R6 头像、眼睛、嘴巴（与对话框同显隐，中心点 X309 Y580，状态2 上移 30） */
    .square-dialog-face {
      position: absolute;
      left: 309px;
      top: 580px;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;

    .square-dialog-face .square-dialog-r6-inner {

      top: 50%;
      transform: translate(-50%, -50%) scale(0.5);

      position: absolute;
      top: 206.5px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;

      justify-content: center;
    }
    .square-dialog-face .r6-avatar-svg { display: block; width: auto; height: auto; }
    .square-dialog-face .r6-eyes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 793px;
      z-index: 5;
      pointer-events: none;
    }
    .square-dialog-face .r6-eye { will-change: transform; opacity: 1 !important; }
    .square-dialog-face .r6-eye-left {
      transform-origin: 172.5px 206.5px;
      animation: squareDialogR1EyeLeft 6s cubic-bezier(0.33, 0, 0.2, 1) infinite;
    }
    .square-dialog-face .r6-eye-right {
      transform-origin: 187.5px 206.5px;
      animation: squareDialogR1EyeRight 6s cubic-bezier(0.33, 0, 0.2, 1) infinite;
    }
    .square-dialog-face .r6-mouth {
      position: absolute;
      top: 219.5px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      transform-origin: center center;
      animation: squareDialogR6Mouth 6s cubic-bezier(0.33, 0, 0.2, 1) infinite;
    }
    .square-dialog-face .r6-mouth-svg { display: block; width: auto; height: auto; }
    /* 状态2：两个头像 ICON；默认收拢在渐变圆中心 0.1 倍，点击右下角头像切换为展开位置 1 倍 */
    .state2-avatar-icon {
      position: absolute;
      width: 42px;
      height: 42px;
      pointer-events: none;
      z-index: 2000;
      display: none;
      transition: left 0.35s ease, top 0.35s ease, transform 0.35s ease;
    }
    .state2-avatar-icon.is-visible { display: block; }
    /* 默认收拢：与渐变圆中心一致 (309,630)，缩放 0.1 */
    .state2-avatar-icon.icon-301-584 {
      left: 309px;
      top: 630px;
      transform: translate(-50%, -50%) scale(0.1);
    }
    .state2-avatar-icon.icon-251-609 {
      left: 309px;
      top: 630px;
      transform: translate(-50%, -50%) scale(0.1);
    }
    /* 展开态：恢复各自位置与 1 倍大小 */
    .main-frame.state2-avatars-expanded .state2-avatar-icon.icon-301-584 {
      left: 301px;
      top: 574px;
      transform: translate(-50%, -50%) scale(1);
    }
    .main-frame.state2-avatars-expanded .state2-avatar-icon.icon-251-609 {
      left: 251px;
      top: 599px;
      transform: translate(-50%, -50%) scale(1);
    }
    .state2-avatar-icon img { width: 100%; height: 100%; display: block; object-fit: contain; }
    /* 状态2：头像正下方渐变圆；默认收拢 0.1 倍，点击右下角头像切换为 1 倍 */
    .state2-avatar-glow {
      position: absolute;
      left: 309px;
      top: 630px;
      width: 240px;
      height: 240px;
      transform: translate(-50%, -50%) scale(0.1);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(243, 244, 248, 1) 0%, rgba(243, 244, 248, 0) 100%);
      z-index: 16;
      pointer-events: none;
      display: none;
      transition: transform 0.35s ease;
    }
    .state2-avatar-glow.is-visible { display: block; }
    .main-frame.state2-avatars-expanded .state2-avatar-glow {
      transform: translate(-50%, -50%) scale(1);
    }
    @keyframes squareDialogR1EyeLeft {
      0%, 100% { transform: translate(0, 0) scaleY(1); }
      15% { transform: translate(20px, -12px) scaleY(1); }
      30% { transform: translate(15px, 16px) scaleY(1); }
      38% { transform: translate(10px, 18px) scaleY(1); }
      41% { transform: translate(10px, 18px) scaleY(0.08); }
      44% { transform: translate(10px, 18px) scaleY(1); }
      55% { transform: translate(-15px, -15px) scaleY(1); }
      72% { transform: translate(-18px, 12px) scaleY(1); }
      85% { transform: translate(-15px, -15px) scaleY(1); }
    }
    @keyframes squareDialogR1EyeRight {
      0%, 100% { transform: translate(0, 0) scaleY(1); }
      15% { transform: translate(20px, -12px) scaleY(1); }
      30% { transform: translate(15px, 16px) scaleY(1); }
      38% { transform: translate(10px, 18px) scaleY(1); }
      41% { transform: translate(10px, 18px) scaleY(0.08); }
      44% { transform: translate(10px, 18px) scaleY(1); }
      55% { transform: translate(-15px, -15px) scaleY(1); }
      72% { transform: translate(-18px, 12px) scaleY(1); }
      85% { transform: translate(-15px, -15px) scaleY(1); }
    }
    @keyframes squareDialogR6Mouth {
      0%, 100% { transform: translateX(-50%) translate(0, 0) scale(1); }
      15% { transform: translateX(-50%) translate(20px, -12px) scale(1.08); }
      30% { transform: translateX(-50%) translate(15px, 16px) scale(0.9); }
      38% { transform: translateX(-50%) translate(10px, 18px) scale(0.85); }
      41% { transform: translateX(-50%) translate(10px, 18px) scale(0.95); }
      44% { transform: translateX(-50%) translate(10px, 18px) scale(1.1); }
      55% { transform: translateX(-50%) translate(-15px, -15px) scale(1.2); }
      72% { transform: translateX(-50%) translate(-18px, 12px) scale(0.88); }
      85% { transform: translateX(-50%) translate(-15px, -15px) scale(0.92); }
    }
    .start-button svg {
      display: block;
    }
    /* 眼睛动画 - 在白色圆球范围内四处张望 */
    @keyframes eyeLookAround {
      0%, 100% {
        transform: translate(0, 0);
      }
      15% {
        transform: translate(6px, -2px);
      }
      30% {
        transform: translate(5px, 2px);
      }
      45% {
        transform: translate(-3px, 3px);
      }
      60% {
        transform: translate(7px, -1px);
      }
      75% {
        transform: translate(4px, 4px);
      }
      90% {
        transform: translate(-2px, -2px);
      }
    }
    .start-button .eye-left,
    .start-button .eye-right {
      animation: eyeLookAround 6s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
      backface-visibility: hidden;
    }
    /* 气泡消失动画：先略微放大，然后快速缩小到 0.01%（保持元素存在） */
    @keyframes bubbleHide {
      0% {
        opacity: 1;
        transform: scale(1) translate(0, 0);
      }
      30% {
        opacity: 1;
        transform: scale(1.15) translate(0, 0);
      }
      100% {
        opacity: 0;
        transform: scale(0.01) translate(0, 0);
      }
    }
    /* 气泡出现动画：从 0.01% 开始放大，先超过100%然后回缩到100%（镜像消失动画） */
    @keyframes bubbleShow {
      0% {
        opacity: 0;
        transform: scale(0.01) translate(0, 0);
      }
      70% {
        opacity: 1;
        transform: scale(1.15) translate(0, 0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translate(0, 0);
      }
    }
    /* iframe 包装容器：用于实现缩放动画 */
    .bubble-wrapper {
      position: absolute;
      transform-origin: center bottom;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      z-index: 10;
      transition: transform 0.1s ease-out, opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      /* 强制硬件加速 */
      backface-visibility: hidden;
      perspective: 1000px;
    }
    .bubble-wrapper.is-dragging {
      transition: none !important;
      will-change: transform, left, top;
    }
    .bubble-wrapper.is-hidden {
      animation: bubbleHide 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
    }
    .bubble-wrapper.is-showing {
      animation: bubbleShow 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
    }
    .main-frame iframe {
      position: absolute;
      border: none;
      background: transparent;
      pointer-events: auto;
      z-index: 10;
      overflow: hidden;
      width: 100%;
      height: 100%;
      transition: width 0.28s ease, height 0.28s ease;

    /* 注意：left 和 top 由 JavaScript 动态设置，这里只清除 transform */

    }
    .main-frame .iframe-bubble6 {

      height: 191px;
      transition: width 0.28s ease, height 0.28s ease;
      background: transparent;

      pointer-events: auto !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
    .main-frame .iframe-bubble6.is-expanded {

      height: 286px;
    }
    .main-frame .bubble-wrapper-bubble6.is-expanded {
      width: 235px;
      height: 286px;
      z-index: 10001 !important;
    }
    .main-frame .iframe-bubble6.is-expanded {
      z-index: 10001 !important;
    }
    /* bubble7：容器中心位置（向右偏移400px，向下偏移100px），默认态 158×178，展开态 223×274，置顶显示 */
    .main-frame .bubble-wrapper-bubble7 {
      left: calc(50% + 400px);
      top: calc(50% + 100px);
      transform: translate(-50%, -50%);
      width: 158px;
      height: 178px;

      pointer-events: auto !important;

    .main-frame .iframe-bubble7.is-expanded {

      height: 274px;
    }
    .main-frame .bubble-wrapper-bubble7.is-expanded {

      height: 274px;
      z-index: 10001 !important;
    }
    .main-frame .iframe-bubble7.is-expanded {
      z-index: 10001 !important;
    }
    /* 主界面全屏遮罩：仅模糊、不变暗，任一气泡（含 bubble5、bubble6、bubble7）长按展开时显示，点击关闭 */
    .main-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 360px;
      height: 793px;
      background: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      cursor: pointer;
      transition: opacity 0.28s ease, visibility 0s linear 0.28s;
    }
    .main-overlay.is-visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.28s ease, visibility 0s;
    }
    /* 展开时当前气泡包装容器提到遮罩之上；位置微改用 left/top 使布局盒移动，避免 overflow 裁掉底部 */
    .main-frame .bubble-wrapper.is-expanded {
      z-index: 1001;
    }
    .main-frame iframe.is-expanded {
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                  transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  width 0.28s ease, 
                  height 0.28s ease, 
                  left 0.28s ease, 
                  top 0.28s ease;
    }

    .liquid-sidebar {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateX(100%) translateY(-50%);
      width: 110px;
      height: 563px;
      z-index: 2000;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: visible;
    }
    .liquid-sidebar.is-visible {
      transform: translateX(0) translateY(-50%);
      pointer-events: auto;
    }
    /* 头像图片容器 - 叠加在SVG上 */
    .sidebar-avatars {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(calc(-50% + 30px), -50%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 97px;
      gap: calc((365px - 97px * 5) / 4 / 2);
      padding: 0;
      z-index: 1;
    }
    .sidebar-avatar {
      width: 97px;
      height: auto;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
      position: relative;
      cursor: pointer;
      pointer-events: auto;
    }
    .liquid-sidebar svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 110px;
      height: 563px;
      display: block;
      z-index: 0;
    }
    .liquid-sidebar-path {
      fill: #000000;
    }
    /* 右边缘点击检测区域（X345-360，即右侧15px） */
    .right-edge-detector {
      position: absolute;
      right: 0;
      top: 0;
      width: 15px;
      height: 100%;
      z-index: 2001;
      pointer-events: auto;
      background: transparent;
      cursor: pointer;
    }

      /** 展开时若 iframe 超出主框架四边，用 left/top 微调使布局盒移入框内（左/右/上/下均生效） */
      function clampExpandedPosition(iframe) {
        if (!iframe || !iframe.classList.contains("is-expanded")) return;
        var wrapper = iframe.parentElement;
        if (!wrapper || !wrapper.classList.contains("bubble-wrapper")) return;
        var main = document.querySelector(".main-frame");
        if (!main) return;
        var mr = main.getBoundingClientRect();
        var wr = wrapper.getBoundingClientRect();
        var w = wr.width, h = wr.height;
        var newLeft = wr.left, newTop = wr.top;
        if (wr.left < mr.left) newLeft = mr.left;
        else if (wr.right > mr.right) newLeft = mr.right - w;
        if (wr.top < mr.top) newTop = mr.top;
        else if (wr.bottom > mr.bottom) newTop = mr.bottom - h;
        var relLeft = newLeft - mr.left, relTop = newTop - mr.top;
        wrapper.style.right = "auto";
        wrapper.style.bottom = "auto";
        wrapper.style.left = relLeft + "px";
        wrapper.style.top = relTop + "px";
        
        // 更新绝对位置，但不更新相对位置（相对位置保持不变）
        // 因为展开态的位置调整是临时的，收缩时应该恢复到基于相对位置的默认态位置
        var wrapperId = wrapper.id;
        var bubbleIndex = null;
        if (wrapperId === "wrapper-bubble1") bubbleIndex = 1;
        else if (wrapperId === "wrapper-bubble2") bubbleIndex = 2;
        else if (wrapperId === "wrapper-bubble3") bubbleIndex = 3;
        else if (wrapperId === "wrapper-bubble4") bubbleIndex = 4;
        else if (wrapperId === "wrapper-bubble5") bubbleIndex = 5;
        else if (wrapperId === "wrapper-bubble6") bubbleIndex = 6;
        else if (wrapperId === "wrapper-bubble7") bubbleIndex = 7;
        
        if (bubbleIndex) {
          bubbleOffsets["bubble" + bubbleIndex] = {
            x: relLeft,
            y: relTop
          };
          // 注意：不更新 bubbleRelativeOffsets，保持相对位置不变
        }
      }

      function clearExpandedPosition(iframe) {
        if (!iframe) return;
        var wrapper = iframe.parentElement;
        if (!wrapper || !wrapper.classList.contains("bubble-wrapper")) return;
        
        // 基于相对位置恢复到默认态位置
        var wrapperId = wrapper.id;
        var bubbleIndex = null;
        if (wrapperId === "wrapper-bubble1") bubbleIndex = 1;
        else if (wrapperId === "wrapper-bubble2") bubbleIndex = 2;
        else if (wrapperId === "wrapper-bubble3") bubbleIndex = 3;
        else if (wrapperId === "wrapper-bubble4") bubbleIndex = 4;
        else if (wrapperId === "wrapper-bubble5") bubbleIndex = 5;
        else if (wrapperId === "wrapper-bubble6") bubbleIndex = 6;
        else if (wrapperId === "wrapper-bubble7") bubbleIndex = 7;
        
        if (bubbleIndex && bubbleRelativeOffsets["bubble" + bubbleIndex]) {
          // 有相对位置记录，基于相对位置恢复到默认态位置
          var mainRect = mainFrame.getBoundingClientRect();
          var islandCenterX = mainRect.left + mainRect.width / 2 + islandOffsetX;
          var islandCenterY = mainRect.top + mainRect.height / 2 + islandOffsetY;
          
          var relativeOffset = bubbleRelativeOffsets["bubble" + bubbleIndex];
          var wrapperRect = wrapper.getBoundingClientRect();
          var bubbleWidth = wrapperRect.width;
          var bubbleHeight = wrapperRect.height;
          
          // 计算气泡中心位置（基于相对位置，考虑缩放比例）
          var bubbleCenterX = islandCenterX + relativeOffset.x;
          var bubbleCenterY = islandCenterY + relativeOffset.y;
          
          // 计算气泡左上角位置
          var defaultX = bubbleCenterX - bubbleWidth / 2 - mainRect.left;
          var defaultY = bubbleCenterY - bubbleHeight / 2 - mainRect.top;
          
          wrapper.style.left = defaultX + "px";
          wrapper.style.top = defaultY + "px";
          
          // 更新绝对位置
          bubbleOffsets["bubble" + bubbleIndex] = {
            x: defaultX,
            y: defaultY
          };
        } else {
          // 没有相对位置记录，清空位置回到 CSS 原始位置

          wrapper.style.top = "";

        wrapper.style.right = "";
        wrapper.style.bottom = "";

      /** 计算并设置 islandText 的位置 */
      function positionIslandText() {
        var islandLayer = document.querySelector(".island-layer");
        var islandText = document.querySelector(".island-text");
        var islandElements = islandLayer.querySelectorAll(".island-color, .island-blur, .island");
        
        if (!islandLayer || !islandText || islandElements.length === 0) return;
        
        // 获取所有岛屿元素（除了 islandText）的边界框
        var minLeft = Infinity, maxRight = -Infinity, minTop = Infinity;
        islandElements.forEach(function(el) {
          var rect = el.getBoundingClientRect();
          var layerRect = islandLayer.getBoundingClientRect();
          // 转换为相对于 islandLayer 的坐标
          var left = rect.left - layerRect.left;
          var right = rect.right - layerRect.left;
          var top = rect.top - layerRect.top;
          minLeft = Math.min(minLeft, left);
          maxRight = Math.max(maxRight, right);
          minTop = Math.min(minTop, top);
        });
        
        // 获取 islandText 的尺寸
        var textRect = islandText.getBoundingClientRect();
        var textWidth = textRect.width;
        
        // 计算位置：
        // 最左端距离岛屿最左端 60px：left = minLeft - 60px
        // 最右端距离岛屿最右端 80px：left = maxRight + 80px - textWidth
        // 最高点距离岛屿最高点 50px：top = minTop - 50px
        
        // 由于要求最左端距离 60px，最右端距离 80px，说明 islandText 在岛屿右侧
        // 使用最右端约束：left = maxRight + 80px - textWidth
        // 再向左移动 100px，然后再向左移动 10px
        var left = maxRight + 80 - textWidth - 100 - 10;
        // 最高点距离岛屿最高点 50px，然后向下移动 130px
        var top = minTop - 50 + 130;
        
        // 设置位置（相对于 islandLayer，使用像素值）
        islandText.style.left = left + "px";
        islandText.style.top = top + "px";
        islandText.style.transform = "translate(0, 0)";
      }
      
      // 页面加载后计算位置

        setTimeout(positionIslandText, 100);

        initializeBubbleRelativeOffsets();

      /** 初始化气泡的相对位置（基于初始状态，只执行一次） */
      function initializeBubbleRelativeOffsets() {
        // 如果已经初始化过，不再重复初始化（但允许强制重新初始化）
        var forceReinit = arguments[0] === true;
        if (!forceReinit && Object.keys(bubbleRelativeOffsets).length > 0) return;
        
        var mainFrame = document.querySelector(".main-frame");
        var islandLayer = document.querySelector(".island-layer");
        if (!mainFrame || !islandLayer) return;
        
        var mainRect = mainFrame.getBoundingClientRect();
        // 岛屿中心在主框架中的位置（初始状态，islandOffsetX/Y = 0）
        var islandCenterX = mainRect.left + mainRect.width / 2;
        var islandCenterY = mainRect.top + mainRect.height / 2;
        
        var wrappers = [
          document.getElementById("wrapper-bubble1"),
          document.getElementById("wrapper-bubble2"),
          document.getElementById("wrapper-bubble3"),
          document.getElementById("wrapper-bubble4"),
          document.getElementById("wrapper-bubble5"),
          document.getElementById("wrapper-bubble6"),
          document.getElementById("wrapper-bubble7")
        ];
        
        wrappers.forEach(function(wrapper, index) {
          if (wrapper) {
            var wrapperRect = wrapper.getBoundingClientRect();
            var bubbleCenterX = wrapperRect.left + wrapperRect.width / 2;
            var bubbleCenterY = wrapperRect.top + wrapperRect.height / 2;
            
            // 计算相对位置（气泡中心相对于岛屿中心，基于初始状态）
            var relativeX = bubbleCenterX - islandCenterX;
            var relativeY = bubbleCenterY - islandCenterY;
            
            // 计算相对位置（不要重置为(0, 0)，保持计算出的值）
            // bubble6和bubble7使用居中定位，可能不在中心位置，相对位置较大是正常的
            // bubble6向右偏移650px向上偏移100px，相对位置X约为650，Y约为-100是正常的
            // bubble7在容器中心，相对位置应该接近(0, 0)
            if (wrapper.id === "wrapper-bubble6" && (Math.abs(relativeX - 650) > 50 || Math.abs(relativeY + 100) > 50)) {
              console.warn("[Bubble6] 初始化时相对位置异常，但保持计算值:", relativeX, relativeY);
            }
            if (wrapper.id === "wrapper-bubble7" && (Math.abs(relativeX) > 50 || Math.abs(relativeY) > 50)) {
              console.warn("[Bubble7] 初始化时相对位置异常（应该在中心附近），但保持计算值:", relativeX, relativeY);
            }
            
            bubbleRelativeOffsets["bubble" + (index + 1)] = {
              x: relativeX,
              y: relativeY
            };
            
            // bubble6 和 bubble7 同时保存两种key格式
            if (wrapper.id === "wrapper-bubble6") {
              bubbleRelativeOffsets["bubble6"] = {
                x: relativeX,
                y: relativeY
              };
            } else if (wrapper.id === "wrapper-bubble7") {
              bubbleRelativeOffsets["bubble7"] = {
                x: relativeX,
                y: relativeY
              };
            }
          }
        });
        
        // 初始化后，立即将bubble7从居中定位转换为绝对定位（基于相对位置）
        var wrapperBubble7 = document.getElementById("wrapper-bubble7");
        if (wrapperBubble7 && bubbleRelativeOffsets["bubble7"]) {
          var mainFrame = document.querySelector(".main-frame");
          var islandLayer = document.querySelector(".island-layer");
          if (mainFrame && islandLayer) {
            var mainRect = mainFrame.getBoundingClientRect();
            var islandRect = islandLayer.getBoundingClientRect();
            var islandCenterX = islandRect.left + islandRect.width / 2;

        }
      }
      
      function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        
        var clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
        var clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
        
        var wrappers = getWrappers();
        
        if (clientX && clientY) {
          var deltaX = clientX - dragStartX;
          var deltaY = clientY - dragStartY;
          
          // 更新岛屿的最终位置（已经在 onDrag 中实时更新了，这里只是确认）
          var finalIslandX = islandOffsetX + deltaX;
          var finalIslandY = islandOffsetY + deltaY;
          islandOffsetX = finalIslandX; // 更新岛屿偏移
          islandOffsetY = finalIslandY;
          islandLayer.style.left = "50%";
          islandLayer.style.top = "50%";
          islandLayer.style.transform = "translate3d(calc(-50% + " + finalIslandX + "px), calc(-50% + " + finalIslandY + "px), 0) scale(1.1)";
          
          // 更新所有气泡的相对位置（清除惯性偏移，恢复到最终相对位置）
          var mainRect = mainFrame.getBoundingClientRect();
          var finalIslandCenterX = mainRect.left + mainRect.width / 2 + finalIslandX;
          var finalIslandCenterY = mainRect.top + mainRect.height / 2 + finalIslandY;
          var wrappers = getWrappers();
          
          wrappers.forEach(function(wrapper, index) {
            if (wrapper && bubbleRelativeOffsets["bubble" + (index + 1)]) {
              var relativeOffset = bubbleRelativeOffsets["bubble" + (index + 1)];
              // 清除惯性偏移，恢复到最终相对位置；隐藏态时用布局尺寸
              var size = getBubbleLayoutSize(wrapper);
              var bubbleWidth = size.width;
              var bubbleHeight = size.height;
              
              // 计算最终位置（基于相对位置，但需要从相对位置中提取基础偏移，去掉惯性部分）
              // 基于相对位置计算最终位置（清除惯性，考虑缩放比例）
              var bubbleCenterX = finalIslandCenterX + relativeOffset.x;
              var bubbleCenterY = finalIslandCenterY + relativeOffset.y;
              
              var finalX = bubbleCenterX - bubbleWidth / 2 - mainRect.left;
              var finalY = bubbleCenterY - bubbleHeight / 2 - mainRect.top;
              
              wrapper.style.left = finalX + "px";
              wrapper.style.top = finalY + "px";
              wrapper.style.right = "auto";
              wrapper.style.bottom = "auto";
              // bubble6 和 bubble7 使用居中定位，拖拽结束时需要清除 transform
              if (wrapper.id === "wrapper-bubble6" || wrapper.id === "wrapper-bubble7") {
                wrapper.style.transform = "translate(0, 0)";
              }
              
              // 更新绝对位置（清除惯性）
              bubbleOffsets["bubble" + (index + 1)] = {
                x: finalX,
                y: finalY
              };
              // 相对位置保持不变（因为岛屿和气泡都移动了相同的距离）
            }
          });
          
          // 应用惯性摆动效果（基于最后的速度）
          applyInertiaSwing(finalIslandX, finalIslandY, wrappers);
        }
        
        // 移除拖拽类，恢复 transition
        islandLayer.classList.remove("is-dragging");
        islandLayer.style.transition = "";
        var wrappers = getWrappers();
        wrappers.forEach(function(wrapper) {
          if (wrapper) {
            wrapper.classList.remove("is-dragging");
            wrapper.style.transition = "";
          }
        });
        
        document.removeEventListener("mousemove", onDrag, true);
        document.removeEventListener("mouseup", endDrag, true);
        document.removeEventListener("touchmove", onDrag, true);
        document.removeEventListener("touchend", endDrag, true);
        
        // 移除 willChange 优化提示
        islandLayer.style.willChange = "";
        var wrappers = getWrappers();
        wrappers.forEach(function(wrapper) {
          if (wrapper) {
            wrapper.style.willChange = "";
          }
        });
        
        // 重置速度跟踪
        velocityX = 0;
        velocityY = 0;
        prevClientX = 0;
        prevClientY = 0;
        prevTime = 0;
        
        // 重置长按状态
        wasLongPress = false;
      }
      
      /** 应用惯性摆动效果：松开后根据最后的速度产生摆动 */
      function applyInertiaSwing(islandX, islandY, wrappers) {
        // 限制速度范围，避免摆动过大
        var maxVelocity = 10;
        var dampedVelocityX = Math.max(-maxVelocity, Math.min(maxVelocity, velocityX * 0.6));
        var dampedVelocityY = Math.max(-maxVelocity, Math.min(maxVelocity, velocityY * 0.6));
        
        // 如果速度太小，不应用摆动
        if (Math.abs(dampedVelocityX) < 0.5 && Math.abs(dampedVelocityY) < 0.5) return;
        
        // 为每个气泡添加不同的摆动延迟和幅度，产生波浪效果
        wrappers.forEach(function(wrapper, index) {
          if (wrapper && bubbleOffsets["bubble" + (index + 1)]) {
            var delay = index * 15; // 减小延迟：从 25ms 改为 15ms
            var amplitude = 0.7 + Math.random() * 0.3; // 随机幅度 0.7-1.0
            
            setTimeout(function() {
              // 获取当前的 scale 值（从 is-hidden 或 is-showing 类判断）
              var currentScale = wrapper.classList.contains("is-hidden") ? 0.01 : 
                                 wrapper.classList.contains("is-showing") ? 1 : 1;
              
              // 计算摆动幅度（基于速度和方向）- 进一步减小幅度系数
              var swingX = dampedVelocityX * amplitude * 3; // 从 6 减小到 3，进一步缩小摆动幅度
              var swingY = dampedVelocityY * amplitude * 3;
              
              // 缩短摆动时间：从 0.6s 改为 0.3s，更快完成
              wrapper.style.transition = "transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
              // bubble6和bubble7使用居中定位，需要在居中transform基础上叠加摆动
              if ((wrapper.id === "wrapper-bubble6" || wrapper.id === "wrapper-bubble7") && !wrapper.style.left && !wrapper.style.top) {
                // 使用居中定位时，在translate(-50%, -50%)基础上叠加摆动
                wrapper.style.transform = "translate(calc(-50% + " + swingX + "px), calc(-50% + " + swingY + "px)) scale(" + currentScale + ")";
              } else {
                wrapper.style.transform = "translate3d(" + swingX + "px, " + swingY + "px, 0) scale(" + currentScale + ")";
              }
              
              // 缩短回弹时间：从 0.4s 改为 0.2s，从 600ms 延迟改为 300ms
              setTimeout(function() {
                wrapper.style.transition = "transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)";
                // bubble6和bubble7使用居中定位，需要恢复正确的transform
                if (wrapper.id === "wrapper-bubble6" || wrapper.id === "wrapper-bubble7") {
                  // 如果wrapper没有内联的left/top（即使用CSS居中定位），恢复居中transform
                  if (!wrapper.style.left && !wrapper.style.top) {
                    wrapper.style.transform = "translate(-50%, -50%) scale(" + currentScale + ")";
                  } else {
                    // 如果已经转换为绝对定位，保持translate(0, 0)
                    wrapper.style.transform = "translate3d(0, 0, 0) scale(" + currentScale + ")";
                  }
                } else {
                  wrapper.style.transform = "translate3d(0, 0, 0) scale(" + currentScale + ")";
                }
              }, 300);
            }, delay);
          }
        });
      }
      
      /** 主界面点击/长按事件：点击非气泡区域时切换气泡显示/隐藏，长按时拖拽（气泡不消失） */
      var clickStartTime = 0;
      var clickStartX = 0;
      var clickStartY = 0;
      var hasMoved = false;
      var wasLongPress = false;
      var lastDragX = 0;
      var lastDragY = 0;
      var velocityX = 0;
      var velocityY = 0;
      var lastTime = 0;
      var currentMouseX = 0; // 实时跟踪当前鼠标位置
      var currentMouseY = 0;
      var preDragMoveHandler = null; // 预拖拽移动处理器
      var preDragUpHandler = null; // 预拖拽抬起处理器
      
      mainFrame.addEventListener("mousedown", function(ev) {
        // 如果点击的是气泡区域，不处理
        if (isBubbleArea(ev.target)) return;
        // 如果点击的是遮罩层，不处理（遮罩层有自己的处理逻辑）
        if (ev.target === overlay || overlay.contains(ev.target)) return;
        // 状态2：点击半透明层及其上方元素（卡片、轮播、眼睛等）不触发气泡缩放/拖拽
        if (isState2Layer(ev.target)) return;
        // 如果点击的是岛屿层，不处理
        if (islandLayer && (ev.target === islandLayer || islandLayer.contains(ev.target))) return;
        
        clickStartTime = Date.now();
        clickStartX = ev.clientX;
        clickStartY = ev.clientY;
        currentMouseX = ev.clientX; // 初始化当前鼠标位置
        currentMouseY = ev.clientY;
        hasMoved = false;
        wasLongPress = false;
        velocityX = 0;
        velocityY = 0;
        lastTime = Date.now();
        lastDragX = ev.clientX;
        lastDragY = ev.clientY;
        
        // 清除之前的长按计时器
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        
        // 立即绑定 mousemove 和 mouseup，用于跟踪鼠标位置
        preDragMoveHandler = function(moveEv) {
          // 实时更新当前鼠标位置
          currentMouseX = moveEv.clientX;
          currentMouseY = moveEv.clientY;
          
          if (longPressTimer) {
            // 检查是否移动了
            var moveX = Math.abs(moveEv.clientX - clickStartX);
            var moveY = Math.abs(moveEv.clientY - clickStartY);
            if (moveX > 5 || moveY > 5) {
              hasMoved = true;
            }
          }
        };
        
        preDragUpHandler = function(upEv) {
          // 清理预拖拽事件监听器
          document.removeEventListener("mousemove", preDragMoveHandler);
          document.removeEventListener("mousemove", preDragStartHandler);
          document.removeEventListener("mouseup", preDragUpHandler);
          preDragMoveHandler = null;
          preDragStartHandler = null;
          preDragUpHandler = null;
          
          if (longPressTimer) {
            // 如果只是点击（没有长按），清除计时器并切换显示状态
            clearTimeout(longPressTimer);
            longPressTimer = null;
            
            // 如果没有移动，且是快速点击（不是长按），切换气泡显示/隐藏
            if (!hasMoved && Date.now() - clickStartTime < 500 && !wasLongPress) {
              toggleBubblesVisibility();
            }
          }
          // 如果不是长按拖拽，重置状态
          if (!isDragging) {
            wasLongPress = false;
          }
        };
        
        document.addEventListener("mousemove", preDragMoveHandler);
        document.addEventListener("mouseup", preDragUpHandler);
        
        // 思路7：在预拖拽阶段就开始跟踪移动，一旦检测到移动就立即开始拖拽
        var preDragStartHandler = function(moveEv) {
          // 如果鼠标移动超过阈值，立即开始拖拽（不等500ms）
          var moveX = Math.abs(moveEv.clientX - clickStartX);
          var moveY = Math.abs(moveEv.clientY - clickStartY);
          if ((moveX > 10 || moveY > 10) && longPressTimer) {
            // 立即开始拖拽
            clearTimeout(longPressTimer);
            longPressTimer = null;
            wasLongPress = true;
            
            // 清理预拖拽事件监听器
            document.removeEventListener("mousemove", preDragMoveHandler);
            document.removeEventListener("mousemove", preDragStartHandler);
            document.removeEventListener("mouseup", preDragUpHandler);
            preDragMoveHandler = null;
            preDragStartHandler = null;
            preDragUpHandler = null;
            
            // 立即开始拖拽
            var currentEv = { 
              clientX: currentMouseX, 
              clientY: currentMouseY,
              touches: ev.touches
            };
            startDrag(currentEv);
          }
        };
        
        // 设置长按计时器（500ms）
        longPressTimer = setTimeout(function() {
          longPressTimer = null;
          wasLongPress = true;
          
          // 清理预拖拽事件监听器
          document.removeEventListener("mousemove", preDragMoveHandler);
          document.removeEventListener("mousemove", preDragStartHandler);
          document.removeEventListener("mouseup", preDragUpHandler);
          preDragMoveHandler = null;
          preDragStartHandler = null;
          preDragUpHandler = null;
          
          // 长按后开始拖拽（气泡不消失）
          // 使用当前实时鼠标位置初始化拖拽，而不是500ms前的位置！
          var currentEv = { 
            clientX: currentMouseX, 
            clientY: currentMouseY,
            touches: ev.touches
          };
          startDrag(currentEv);
        }, 500);
        
        // 思路7：立即绑定移动检测，一旦移动就立即开始拖拽
        document.addEventListener("mousemove", preDragStartHandler);
      });
      
      mainFrame.addEventListener("mousemove", function(ev) {
        // 这个监听器保留用于其他用途，但预拖拽跟踪已移到 document 级别
      });
      
      mainFrame.addEventListener("mouseup", function(ev) {
        // mouseup 处理已移到 preDragUpHandler，这里保留用于其他情况
      });
      
      var preDragTouchMoveHandler = null;
      var preDragTouchEndHandler = null;
      
      mainFrame.addEventListener("touchstart", function(ev) {
        // 如果点击的是气泡区域，不处理
        if (isBubbleArea(ev.target)) return;
        // 如果点击的是遮罩层，不处理
        if (ev.target === overlay || overlay.contains(ev.target)) return;
        // 状态2：点击半透明层及其上方元素（卡片、轮播、眼睛等）不触发气泡缩放/拖拽
        if (ev.touches.length > 0 && isState2Layer(ev.target)) return;
        // 如果点击的是岛屿层，不处理
        if (islandLayer && (ev.target === islandLayer || islandLayer.contains(ev.target))) return;
        
        var touch = ev.touches[0];
        clickStartTime = Date.now();
        clickStartX = touch.clientX;
        clickStartY = touch.clientY;
        currentMouseX = touch.clientX; // 初始化当前触摸位置
        currentMouseY = touch.clientY;
        hasMoved = false;
        wasLongPress = false;
        velocityX = 0;
        velocityY = 0;
        lastTime = Date.now();
        lastDragX = touch.clientX;
        lastDragY = touch.clientY;
        
        // 清除之前的长按计时器
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        
        // 立即绑定 touchmove 和 touchend，用于跟踪触摸位置
        preDragTouchMoveHandler = function(moveEv) {
          if (moveEv.touches.length > 0) {
            var currentTouch = moveEv.touches[0];
            // 实时更新当前触摸位置
            currentMouseX = currentTouch.clientX;
            currentMouseY = currentTouch.clientY;
            
            if (longPressTimer) {
              var moveX = Math.abs(currentTouch.clientX - clickStartX);
              var moveY = Math.abs(currentTouch.clientY - clickStartY);
              if (moveX > 5 || moveY > 5) {
                hasMoved = true;
              }
            }
          }
        };
        
        preDragTouchEndHandler = function(endEv) {
          // 清理预拖拽事件监听器
          document.removeEventListener("touchmove", preDragTouchMoveHandler);
          document.removeEventListener("touchend", preDragTouchEndHandler);
          preDragTouchMoveHandler = null;
          preDragTouchEndHandler = null;
          
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
            
            if (!hasMoved && Date.now() - clickStartTime < 500 && !wasLongPress) {
              toggleBubblesVisibility();
            }
          }
          if (!isDragging) {
            wasLongPress = false;
          }
        };
        
        document.addEventListener("touchmove", preDragTouchMoveHandler, { passive: false });
        document.addEventListener("touchend", preDragTouchEndHandler);
        
        // 设置长按计时器（500ms）
        longPressTimer = setTimeout(function() {
          longPressTimer = null;
          wasLongPress = true;
          
          // 清理预拖拽事件监听器
          document.removeEventListener("touchmove", preDragTouchMoveHandler);
          document.removeEventListener("touchend", preDragTouchEndHandler);
          preDragTouchMoveHandler = null;
          preDragTouchEndHandler = null;
          
          // 长按后开始拖拽（气泡不消失）
          // 使用当前实时触摸位置初始化拖拽，而不是500ms前的位置！
          var currentTouch = ev.touches[0];
          startDrag({ 
            clientX: currentMouseX, 
            clientY: currentMouseY,
            touches: ev.touches
          });
        }, 500);
      });
      
      mainFrame.addEventListener("touchmove", function(ev) {
        // 这个监听器保留用于其他用途，但预拖拽跟踪已移到 document 级别
      });
      
      mainFrame.addEventListener("touchend", function(ev) {
        if (longPressTimer) {
          // 如果只是点击（没有长按），清除计时器并切换显示状态
          clearTimeout(longPressTimer);
          longPressTimer = null;
          
          // 如果没有移动，且是快速点击，切换气泡显示/隐藏
          if (!hasMoved && Date.now() - clickStartTime < 500 && !wasLongPress) {
            toggleBubblesVisibility();
          }
        }
      });

      /* 黑色梯形侧边栏：在X345-360区域点击显示 */
      (function initLiquidSidebar() {
        var liquidSidebar = document.getElementById("liquid-sidebar");
        var rightEdgeDetector = document.getElementById("right-edge-detector");
        if (!liquidSidebar || !rightEdgeDetector) return;

        var isSidebarVisible = false;

        // 点击检测区域（X345-360，右侧15px）切换侧边栏显示
        rightEdgeDetector.addEventListener("click", function(e) {
          e.stopPropagation();
          isSidebarVisible = !isSidebarVisible;
          if (isSidebarVisible) {
            liquidSidebar.classList.add("is-visible");
          } else {
            liquidSidebar.classList.remove("is-visible");
          }
        });

        // 触摸事件支持
        rightEdgeDetector.addEventListener("touchend", function(e) {
          e.stopPropagation();
          isSidebarVisible = !isSidebarVisible;
          if (isSidebarVisible) {
            liquidSidebar.classList.add("is-visible");
          } else {
            liquidSidebar.classList.remove("is-visible");
          }
        });

        // 点击主界面其他区域关闭侧边栏
        mainFrame.addEventListener("click", function(e) {
          if (isSidebarVisible && !liquidSidebar.contains(e.target) && !rightEdgeDetector.contains(e.target)) {
            var rect = mainFrame.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            
            // 如果点击在侧边栏左侧区域，关闭侧边栏
            if (clickX < rect.width - 110) {
              isSidebarVisible = false;
              liquidSidebar.classList.remove("is-visible");
            }
          }
        });

        // 触摸事件：点击主界面其他区域关闭
        mainFrame.addEventListener("touchstart", function(e) {
          if (isSidebarVisible && !liquidSidebar.contains(e.target) && !rightEdgeDetector.contains(e.target)) {
            var touch = e.touches[0];
            var rect = mainFrame.getBoundingClientRect();
            var touchX = touch.clientX - rect.left;
            
            if (touchX < rect.width - 110) {
              isSidebarVisible = false;
              liquidSidebar.classList.remove("is-visible");
            }
          }
        }, { passive: true });

        // 头像点击热区处理：每个图片以中心为原点，半径20px的圆形热区
        var sidebarAvatars = document.querySelectorAll(".sidebar-avatar");
        var hotZoneRadius = 20; // 热区半径20px

        sidebarAvatars.forEach(function(avatar, index) {
          // 点击事件
          avatar.addEventListener("click", function(e) {
            e.stopPropagation(); // 阻止事件冒泡，避免关闭侧边栏
            var rect = avatar.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var clickX = e.clientX;
            var clickY = e.clientY;
            var distance = Math.sqrt(
              Math.pow(clickX - centerX, 2) + Math.pow(clickY - centerY, 2)
            );
            if (distance <= hotZoneRadius && index === 1) {
              window.location.href = "B1chat/index.html";
            }
          });

          // 触摸事件支持
          avatar.addEventListener("touchend", function(e) {
            e.stopPropagation(); // 阻止事件冒泡
            var rect = avatar.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var touch = e.changedTouches[0];
            var clickX = touch.clientX;
            var clickY = touch.clientY;
            var distance = Math.sqrt(
              Math.pow(clickX - centerX, 2) + Math.pow(clickY - centerY, 2)
            );
            if (distance <= hotZoneRadius && index === 1) {
              window.location.href = "B1chat/index.html";
            }
          });
        });
      })();
    })();

    // PWA Service Worker 注册
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker 注册成功:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker 注册失败:', error);
          });
      });
    }

  </script>
